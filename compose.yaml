services:
  kitaplik:
    build: .
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - type: bind
        source: ${KITAPLIK_DATA_DIR:-./data}
        target: /data
    environment:
      DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
